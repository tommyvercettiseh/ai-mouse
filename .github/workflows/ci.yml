name: AI Mouse Hub CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest pynput
      - name: Compile application
        run: python -m compileall -q ai_mouse_hub
      - name: Run tests
        run: python -m pytest -q
      - name: Verify desktop imports
        run: python -c "import tkinter, pynput; from ai_mouse_hub.global_recorder import GlobalMouseRecorder, virtual_screen_bounds; print(tkinter.TkVersion, virtual_screen_bounds())"
