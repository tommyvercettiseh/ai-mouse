name: Rewrite AI Mouse Lab repository

on:
  push:
    branches: [main]
    paths:
      - ".rewrite/**"
      - ".github/workflows/rewrite-repository.yml"

permissions:
  contents: write

concurrency:
  group: ai-mouse-rewrite
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify and replace repository tree
        run: python .rewrite/rewrite.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile and test clean foundation
        run: |
          python -m compileall -q ai_mouse_lab
          python -m pytest -q

      - name: Verify required project files
        run: |
          test "$(cat VERSION)" = "1.0.0"
          test -f "Start Project.bat"
          test -f "Stop Project.bat"
          test -f "turbo-project.json"
          test -f "docs/previews/latest.svg"
          test ! -e ".rewrite"

      - name: Commit clean AI Mouse Lab foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No rewrite changes to commit."
            exit 0
          fi
          git commit -m "feat: rebuild AI Mouse Lab 1.0.0"
          git push
